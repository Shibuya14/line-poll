# mainブランチに入ったら自動で配備する。
# 手元から make deploy しても同じことができるので、必須ではない。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ワークフロー以外の全ファイル(package.json, infra/, scripts/, wrangler.jsonc等)はapp/配下にある。
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: npm ci

      # D1(poll-dev)は既にCloudflare側に存在するが、CIのterraform stateは
      # 実行のたびにまっさらなので、先にimportしてから apply する(2回目以降も
      # importはno-opなので毎回importしてよい)。importしないと「作成しようと
      # したら既に存在する」で毎回落ちる。
      - name: terraform apply
        working-directory: app/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id:    ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # poll-dev(実際に使っているWorker/D1)をそのまま自動デプロイの対象にする。
          TF_VAR_env:           dev
        run: |
          terraform init
          terraform import cloudflare_d1_database.poll \
            "${TF_VAR_account_id}/3d824ac3-9e2d-43a7-8b38-fa7d312a60e2" || true
          terraform apply -auto-approve

      - name: generate wrangler.jsonc
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
        run: ./scripts/gen-wrangler.sh

      - name: migrate & deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply "$(terraform -chdir=infra output -raw database_name)" --remote
          npx wrangler deploy
