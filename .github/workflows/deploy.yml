# mainブランチに入ったら自動で配備する。
# 手元から make deploy しても同じことができるので、必須ではない。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ワークフロー以外の全ファイル(package.json, infra/, scripts/, wrangler.jsonc等)はapp/配下にある。
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # D1(poll-dev)は既にCloudflare側に存在する前提で、ここでは新規作成/変更は
      # 一切しない(読み取りのみ)。
      #
      # 2026-09-18: ここでterraform apply(import含む)を毎回自動実行していたら、
      # primary_location_hintがimport後に常に差分ありと判定される
      # Cloudflareプロバイダの既知の癖により、既存のD1が誤って削除・空DBで
      # 再作成される事故が起きた。infraのプロビジョニングは意図した時にだけ
      # 手元から `make tf-apply` する運用とし、pushのたびに動くCIからは
      # terraformを完全に外す。
      - name: generate wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
        run: |
          DB_ID=$(npx wrangler d1 list --json \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                const db=JSON.parse(d).find(x=>x.name==="poll-dev");
                if(!db){console.error("poll-dev という名前のD1が見つかりません");process.exit(1);}
                console.log(db.uuid);
              })')
          sed -e "s|__DB_NAME__|poll-dev|g" \
              -e "s|__DB_ID__|${DB_ID}|g" \
              -e "s|__WORKER_NAME__|poll-dev|g" \
              -e "s|__ACCOUNT_ID__|${CLOUDFLARE_ACCOUNT_ID}|g" \
              -e "s|__LINE_CHANNEL_ID__|${LINE_CHANNEL_ID}|g" \
              wrangler.jsonc.tmpl > wrangler.jsonc

      - name: migrate & deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply poll-dev --remote
          npx wrangler deploy
