# mainブランチに入ったら自動で配備する。
# 手元から make deploy しても同じことができるので、必須ではない。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: npm ci

      # D1は既に存在するので apply は差分がなければ何もしない。
      - name: terraform apply
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id:    ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_env:           prod
        run: |
          terraform init
          terraform apply -auto-approve

      - name: generate wrangler.jsonc
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
        run: ./scripts/gen-wrangler.sh

      - name: migrate & deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply "$(terraform -chdir=infra output -raw database_name)" --remote
          npx wrangler deploy
